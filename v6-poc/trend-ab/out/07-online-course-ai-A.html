<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1200px; height:628px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1200px; height: 628px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); position: relative; overflow: hidden; font-family: '701_400'; color: #ffffff; padding: 60px; box-sizing: border-box;">
    <div style="position: absolute; top: -100px; right: -100px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);"></div>
    
    <div style="position: relative; z-index: 1;">
        <div style="font-family: '701_700'; font-size: 24px; color: #00d4ff; margin-bottom: 20px; letter-spacing: 2px;">CODEGROUND AI ACADEMY</div>
        
        <h1 style="font-family: '701_700'; font-size: 82px; line-height: 1.1; margin: 0; padding: 0;">비전공자도<br><span style="color: #00d4ff;">4주 만에</span> 완성하는<br>AI 입문 과정</h1>
        
        <p style="font-size: 28px; color: #b0b0b0; margin: 30px 0 50px 0;">복잡한 코딩은 덜어내고, 핵심 AI 원리만 빠르게 학습하세요.</p>
        
        <div style="display: flex; align-items: center; gap: 30px;">
            <div style="background: rgba(255, 255, 255, 0.1); padding: 20px 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);">
                <span style="font-size: 20px; color: #aaa;">수강료</span>
                <div style="font-family: '701_700'; font-size: 42px; color: #ffffff;">99,000<span style="font-size: 24px;">원</span></div>
            </div>
            
            <div style="background: #ff4757; padding: 20px 40px; border-radius: 12px; transform: rotate(-2deg);">
                <span style="font-family: '701_700'; font-size: 24px;">4월 한정 30% 할인</span>
            </div>
        </div>
    </div>

    <div style="position: absolute; right: 80px; bottom: 80px;">
        <svg width="300" height="300" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#5e2bff;stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="80" fill="url(#grad)" opacity="0.2" />
            <path d="M100 50 L150 130 L50 130 Z" fill="#ffffff" opacity="0.8" />
            <circle cx="100" cy="100" r="30" fill="#ffffff" />
        </svg>
    </div>
</div>
</body>
</html>
