<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1200px; height:628px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1200px; height: 628px; background-color: #F0EEE9; position: relative; overflow: hidden; font-family: '701_400';">
  <!-- Decorative Abstract Elements -->
  <svg viewBox="0 0 1200 628" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.6;">
    <circle cx="950" cy="150" r="120" fill="#A2CFFE" style="filter: blur(60px);" />
    <ellipse cx="200" cy="500" rx="200" ry="100" fill="#E6E6FA" transform="rotate(-15)" style="filter: blur(40px);" />
  </svg>

  <!-- Content Container -->
  <div style="position: relative; z-index: 1; padding: 80px; display: flex; flex-direction: column; justify-content: center; height: 100%; box-sizing: border-box;">
    
    <!-- Brand Name -->
    <div style="font-family: '701_700'; font-size: 48px; letter-spacing: 0.1em; color: #333; margin-bottom: 20px;">NOVA</div>
    
    <!-- Main Copy -->
    <h1 style="font-family: '1301_400'; font-size: 96px; line-height: 1.1; color: #1a1a1a; margin: 0; width: 600px;">봄의 시작,<br>당신의 룩</h1>
    
    <!-- Discount Badge -->
    <div style="margin-top: 40px; display: flex; align-items: center; gap: 20px;">
      <div style="background-color: #FF6347; color: white; font-family: '701_700'; font-size: 32px; padding: 15px 30px; border-radius: 50px; box-shadow: 0 10px 20px rgba(255, 99, 71, 0.3);">
        20% OFF
      </div>
      <div style="font-size: 24px; color: #666;">신상 컬렉션 오픈</div>
    </div>

    <!-- CTA -->
    <div style="margin-top: 50px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); border: 2px solid #333; padding: 15px 40px; width: fit-content; font-family: '701_700'; font-size: 20px; cursor: pointer;">
      지금 쇼핑하기
    </div>
  </div>

  <!-- Image Placeholder (Right side) -->
  <div style="position: absolute; right: 80px; top: 100px; width: 400px; height: 450px; background: #ddd; border-radius: 30px; overflow: hidden; box-shadow: 20px 20px 0px rgba(162, 207, 254, 0.3);">
    <img src="placeholder://fashion-model-spring-look" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- Decorative Grid Lines -->
  <svg viewBox="0 0 1200 628" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500" stroke="#dcdcdc" stroke-width="1" />
  </svg>
</div>
</body>
</html>
