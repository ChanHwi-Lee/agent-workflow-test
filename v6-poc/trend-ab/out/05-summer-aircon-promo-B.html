<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1200px; height:628px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1200px; height: 628px; background-color: #F2F0EB; position: relative; overflow: hidden; font-family: '701_700', sans-serif; color: #1A1A1A; padding: 40px; box-sizing: border-box;">
  <!-- Background Decorative Elements -->
  <svg width="1200" height="628" style="position: absolute; top: 0; left: 0; z-index: 0;">
    <defs>
      <linearGradient id="coolGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#0055FF" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
    <circle cx="1000" cy="100" r="200" fill="url(#coolGradient)" />
    <circle cx="200" cy="500" r="150" fill="#E0E0E0" opacity="0.3" />
  </svg>

  <!-- Header Section -->
  <div style="position: relative; z-index: 1;">
    <h1 style="font-size: 64px; line-height: 1.1; margin: 0; letter-spacing: -2px;">시원한 여름,<br>시작은 <span style="color: #0055FF;">쿨하게</span></h1>
  </div>

  <!-- Bento Grid Layout -->
  <div style="display: flex; gap: 20px; margin-top: 40px; position: relative; z-index: 1;">
    <!-- Main Discount Box -->
    <div style="background: #1A1A1A; color: #F2F0EB; padding: 40px; border-radius: 32px; width: 400px; height: 320px; display: flex; flex-direction: column; justify-content: center;">
      <p style="margin: 0; font-size: 24px; font-family: '701_400';">최대 혜택</p>
      <div style="font-size: 110px; line-height: 1; margin: 10px 0;">40%</div>
      <p style="margin: 0; font-size: 24px; font-family: '701_400';">할인 진행 중</p>
    </div>

    <!-- Right Side Bento Boxes -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="background: #FFFFFF; border: 2px solid #E0E0E0; border-radius: 32px; padding: 30px; width: 320px; height: 150px;">
        <p style="margin: 0; font-size: 20px; color: #666;">부담 없는 결제</p>
        <p style="margin: 5px 0 0 0; font-size: 36px;">무이자 12개월</p>
      </div>
      <div style="background: #D4FF00; border-radius: 32px; padding: 30px; width: 320px; height: 150px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 32px; font-weight: 700;">특가 보기 →</span>
      </div>
    </div>

    <!-- Product Image Placeholder -->
    <div style="position: absolute; right: 20px; top: 20px; width: 350px; height: 400px; background: rgba(255,255,255,0.5); border-radius: 40px; border: 1px solid #E0E0E0; display: flex; align-items: center; justify-content: center;">
      <img src="placeholder://air-conditioner-3d-render" width="300" height="350" style="object-fit: contain;" />
    </div>
  </div>

  <!-- Footer Info -->
  <div style="position: absolute; bottom: 40px; left: 40px; z-index: 1; font-family: '701_400'; color: #666; font-size: 14px;">
    * 본 행사는 재고 소진 시 조기 종료될 수 있습니다. | 2026 SUMMER COOL PROMOTION
  </div>
</div>
</body>
</html>
