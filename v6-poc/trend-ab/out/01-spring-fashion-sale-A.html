<!DOCTYPE html>

<style>

    <div style="margin-top: 40px; display: inline-block; background: #D6336C; color: white; padding: 15px 40px; font-size: 28px; font-weight: 700; border-radius: 50px; box-shadow: 0 10px 20px rgba(214, 51, 108, 0.3);">

    </div>
  </div>

    <span style="font-family: '701_700'; font-size: 48px; color: #D6336C; margin-left: 15px;">20% OFF</span>
  </div>

  <img src="placeholder://fashion-model-spring-look" style="position: absolute; right: 100px; bottom: 0; width: 450px; height: 550px; object-fit: cover; border-radius: 20px 20px 0 0; box-shadow: -20px 0 40px rgba(0,0,0,0.1);">
</div>
