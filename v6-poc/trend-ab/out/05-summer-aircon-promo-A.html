<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1200px; height:628px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1200px; height: 628px; background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%); position: relative; overflow: hidden; font-family: '701_400'; display: flex; flex-direction: column; justify-content: center; padding-left: 80px;">
    <div style="position: absolute; top: 50px; right: 50px; opacity: 0.2;">
        <svg viewBox="0 0 200 200" width="400" height="400">
            <circle cx="100" cy="100" r="80" fill="#00bcd4" />
        </svg>
    </div>
    
    <div style="z-index: 1;">
        <div style="font-family: '1301_400'; font-size: 80px; color: #006064; line-height: 1.2; margin-bottom: 20px;">
            시원한 여름,<br>시작은 쿨하게
        </div>
        
        <div style="display: flex; align-items: center; gap: 30px; margin-top: 40px;">
            <div style="background: #ff5252; color: white; padding: 20px 40px; border-radius: 50px; font-family: '701_700'; font-size: 48px; box-shadow: 0 10px 20px rgba(0,0,0,0.15);">
                최대 40% 할인
            </div>
            <div style="font-family: '701_700'; font-size: 32px; color: #00838f; background: rgba(255,255,255,0.6); padding: 15px 30px; border-radius: 15px;">
                무이자 12개월
            </div>
        </div>

        <div style="margin-top: 60px; background: #006064; color: white; padding: 20px 60px; border-radius: 10px; width: fit-content; font-family: '701_700'; font-size: 28px; cursor: pointer;">
            특가 보기 &gt;
        </div>
    </div>

    <img src="placeholder://air-conditioner-modern" style="position: absolute; right: 100px; bottom: 50px; width: 450px; height: 450px; object-fit: contain;" />
    
    <div style="position: absolute; bottom: 30px; left: 80px; font-size: 18px; color: #006064; opacity: 0.7;">
        * 행사 기간 중 조기 소진될 수 있습니다.
    </div>
</div>
</body>
</html>
