<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";

  font-style: normal;
  font-display: block;
}

<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1200px; height:628px; overflow:hidden; }
</style>

<body>
<div style="width: 1200px; height: 628px; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); position: relative; overflow: hidden; font-family: '701_400'; display: flex; flex-direction: column; justify-content: center; padding: 0 80px; box-sizing: border-box;">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.1; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 40px 40px;"></div>
    
    <div style="position: absolute; top: 80px; right: 80px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(167, 139, 250, 0.3) 0%, transparent 70%); border-radius: 50%;"></div>

    <div style="margin-bottom: 20px;">
        <span style="color: #818cf8; font-family: '701_700'; font-size: 32px; letter-spacing: 2px; text-transform: uppercase;">AURORA LABS</span>
        <h1 style="color: #ffffff; font-family: '701_700'; font-size: 72px; margin: 10px 0 0 0; line-height: 1.1;">
            시니어 백엔드 개발자<br/>
            <span style="color: #a78bfa;">채용 중</span>
        </h1>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 40px;">
        <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 12px; color: #cbd5e1; font-size: 24px;">
            Node.js / TypeScript / AWS
        </div>
        <div style="background: rgba(167, 139, 250, 0.2); border: 1px solid #818cf8; padding: 15px 25px; border-radius: 12px; color: #ffffff; font-family: '701_700'; font-size: 24px;">
            주 4일제 근무
        </div>
        <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 12px; color: #cbd5e1; font-size: 24px;">
            연봉 협의
        </div>
    </div>

    <div style="margin-top: 60px; color: #94a3b8; font-size: 20px;">
        오로라랩스와 함께 미래의 인프라를 설계할 동료를 찾습니다.
    </div>

    <div style="position: absolute; bottom: 60px; right: 80px; width: 60px; height: 60px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
        </svg>
