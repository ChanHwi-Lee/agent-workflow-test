<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1080px; height:1080px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1080px; height: 1080px; background: linear-gradient(135deg, #FFF9F0 0%, #FFE8D6 100%); position: relative; overflow: hidden; font-family: '701_400'; border: 20px solid #FFD1DC; box-sizing: border-box;">
  <div style="position: absolute; top: 80px; left: 80px; z-index: 2;">
    <h2 style="font-family: '701_700'; font-size: 48px; color: #FF8A8A; margin: 0; letter-spacing: 2px;">NEW ARRIVAL</h2>
    <h1 style="font-family: '1301_400'; font-size: 110px; color: #5D4037; margin: 20px 0 0 0; line-height: 1.1;">아이스<br>복숭아 라떼</h1>
    <p style="font-size: 32px; color: #8D6E63; margin-top: 30px;">초여름의 싱그러움을 한 잔에 담았습니다.</p>
  </div>

  <div style="position: absolute; bottom: 100px; left: 80px; background: #FFFFFF; padding: 30px 50px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <div style="display: flex; gap: 40px; align-items: center;">
      <div>
        <span style="font-size: 24px; color: #999;">출시일</span>
        <div style="font-family: '701_700'; font-size: 36px; color: #333;">5월 1일</div>
      </div>
      <div style="width: 2px; height: 50px; background: #EEE;"></div>
      <div>
        <span style="font-size: 24px; color: #999;">가격</span>
        <div style="font-family: '701_700'; font-size: 36px; color: #FF6B6B;">5,500원</div>
      </div>
    </div>
  </div>

  <svg viewBox="0 0 1080 1080" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;">
    <circle cx="850" cy="850" r="300" fill="#FFD1DC" opacity="0.4" />
    <circle cx="200" cy="900" r="150" fill="#FFF0E6" opacity="0.6" />
    <path d="M750 300 Q 950 400 900 600 T 800 800" stroke="#FFB7B7" stroke-width="20" fill="none" stroke-linecap="round" />
  </svg>

  <img src="placeholder://iced-peach-latte-in-glass-cup" style="position: absolute; top: 350px; right: 100px; width: 500px; height: 500px; border-radius: 250px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.15); z-index: 3;" />

  <div style="position: absolute; top: 40px; right: 40px; background: #FF6B6B; color: #FFF; padding: 15px 30px; border-radius: 30px; font-family: '701_700'; font-size: 28px; z-index: 4;">
    SEASONAL PICK
  </div>
</div>
</body>
</html>
