<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1080px; height:1350px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; background-color: #F2F0EA; position: relative; overflow: hidden; font-family: '701_400'; display: flex; flex-direction: column; align-items: center; padding: 60px; box-sizing: border-box;">
  <!-- Background Pattern -->
  <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.08;" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M0 0h100v100H0z" fill="url(#pattern)"/>
    <defs>
      <pattern id="pattern" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M10 0v20M0 10h20" stroke="#005F6A" stroke-width="0.5"/>
      </pattern>
    </defs>
  </svg>

  <!-- Top Badge -->
  <div style="background-color: #B22222; color: #FFF; padding: 12px 30px; border-radius: 50px; font-family: '701_700'; font-size: 28px; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(178,34,34,0.2);">
    2026 추석 한정 에디션
  </div>

  <!-- Title -->
  <h1 style="font-family: '1301_400'; font-size: 96px; color: #005F6A; margin: 0; line-height: 1.2; text-align: center;">
    프리미엄 한과<br>선물세트
  </h1>

  <!-- Product Image Area -->
  <div style="width: 800px; height: 600px; margin: 60px 0; position: relative; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; height: 100%; background: #FFF; border-radius: 40px; box-shadow: 0 40px 60px rgba(0,0,0,0.1); border: 2px solid #D4AF37; overflow: hidden;">
      <img src="placeholder://traditional-korean-sweets-9-pieces-set" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <!-- Decor Ornament -->
    <svg style="position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#F9E498" opacity="0.6"/>
      <path d="M50 20v60M20 50h60" stroke="#D4AF37" stroke-width="4"/>
    </svg>
  </div>

  <!-- Price & Info -->
  <div style="text-align: center; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); padding: 40px; border-radius: 30px; width: 80%;">
    <div style="font-size: 64px; font-family: '701_700'; color: #333; margin-bottom: 20px;">55,000원</div>
    <div style="display: flex; justify-content: center; gap: 20px; font-size: 32px; color: #005F6A;">
      <span style="font-weight: 700;">🚚 빠른 배송</span>
      <span style="color: #ccc;">|</span>
      <span style="font-weight: 700;">✨ 무료 배송</span>
    </div>
  </div>

  <!-- Footer -->
  <div style="margin-top: auto; color: #888; font-size: 24px;">
    정성을 담아 마음을 전합니다
  </div>
</div>
</body>
</html>
