<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1080px; height:1080px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1080px; height: 1080px; background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: '701_700', sans-serif; color: #333;">
    <svg viewBox="0 0 1080 1080" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;">
        <circle cx="150" cy="150" r="80" fill="#FFD700" opacity="0.4" />
        <circle cx="900" cy="200" r="120" fill="#FF6B6B" opacity="0.3" />
        <circle cx="200" cy="850" r="100" fill="#4ECDC4" opacity="0.3" />
    </svg>

    <div style="background: rgba(255, 255, 255, 0.85); padding: 60px; border-radius: 60px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 10px solid #fff; z-index: 1;">
        <div style="font-family: '1301_400'; font-size: 80px; color: #FF6B6B; margin-bottom: 20px; text-transform: uppercase;">Happy Children's Day</div>
        <div style="font-size: 120px; color: #2C3E50; margin: 20px 0; letter-spacing: -2px;">5월 5일</div>
        <div style="font-size: 60px; color: #555; margin-bottom: 50px;">어린이날 특별 세일</div>
        
        <div style="background: #FF6B6B; color: #fff; padding: 30px 80px; border-radius: 100px; font-size: 90px; margin-bottom: 40px; display: inline-block;">전 품목 30%</div>
        
        <div style="background: #4ECDC4; color: #fff; padding: 25px 50px; border-radius: 30px; font-size: 45px; font-family: '701_400';">
            3만원 이상 구매 시 사은품 증정!
        </div>
    </div>

    <div style="position: absolute; bottom: 50px; font-size: 30px; color: #777; font-family: '701_400'; z-index: 1;">
        장난감 세상 매장에서 만나요!
    </div>
</div>
</body>
</html>
