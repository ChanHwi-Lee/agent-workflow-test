<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1200px; height:628px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1200px; height: 628px; background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%); position: relative; overflow: hidden; font-family: '701_400'; display: flex; flex-direction: column; padding: 60px; box-sizing: border-box;">
  <!-- Aurora Glow Effect -->
  <div style="position: absolute; top: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(124, 58, 237, 0.3) 0%, transparent 70%); border-radius: 50%;"></div>
  <div style="position: absolute; bottom: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(45, 212, 191, 0.2) 0%, transparent 70%); border-radius: 50%;"></div>

  <!-- Header Section -->
  <div style="z-index: 1;">
    <div style="color: #2DD4BF; font-family: '701_700'; font-size: 24px; letter-spacing: 0.1em; margin-bottom: 16px;">AURORA LABS RECRUITING</div>
    <h1 style="color: #F8FAFC; font-family: '701_700'; font-size: 64px; margin: 0; line-height: 1.1; width: 700px;">시니어 백엔드<br/>개발자 공개 채용</h1>
  </div>

  <!-- Bento Grid -->
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 60px; z-index: 1;">
    <!-- Tech Stack Card -->
    <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px; backdrop-filter: blur(10px);">
      <div style="color: #94A3B8; font-size: 18px; margin-bottom: 20px;">Tech Stack</div>
      <div style="color: #F8FAFC; font-family: '701_700'; font-size: 28px;">Node.js / TS</div>
      <div style="color: #2DD4BF; font-size: 20px; margin-top: 8px;">AWS Cloud Native</div>
    </div>

    <!-- Perks Card -->
    <div style="background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; justify-content: center;">
      <div style="color: rgba(255,255,255,0.8); font-size: 18px; margin-bottom: 8px;">Work Life</div>
      <div style="color: #FFFFFF; font-family: '701_700'; font-size: 36px;">주 4일제 근무</div>
    </div>

    <!-- Salary Card -->
    <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; justify-content: center;">
      <div style="color: #94A3B8; font-size: 18px; margin-bottom: 8px;">Compensation</div>
      <div style="color: #FF9900; font-family: '701_700'; font-size: 32px;">연봉 협의</div>
    </div>
  </div>

  <!-- Footer Tag -->
  <div style="position: absolute; bottom: 60px; right: 60px; color: #64748B; font-size: 16px; border: 1px solid #334155; padding: 8px 16px; border-radius: 50px;">
    #Senior #Backend #Engineering
  </div>
</div>
</body>
</html>
