<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1080px; height:1350px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; background-color: #fcfaf8; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: '701_400'; color: #4a4a4a;">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 40px solid #e8e3de; box-sizing: border-box;"></div>
    
    <svg width="200" height="200" viewBox="0 0 100 100" style="margin-bottom: 40px;">
        <path d="M50 10 C 30 10, 10 30, 10 50 C 10 70, 30 90, 50 90 C 70 90, 90 70, 90 50 C 90 30, 70 10, 50 10 Z" fill="none" stroke="#d4c5b9" stroke-width="0.5"/>
        <path d="M50 20 L 50 80 M20 50 L 80 50" stroke="#d4c5b9" stroke-width="0.5"/>
        <text x="50" y="55" font-family="1301_400" font-size="12" text-anchor="middle" fill="#c4b5a9">Wedding</text>
    </svg>

    <h1 style="font-family: '1301_400'; font-size: 84px; font-weight: 400; margin: 0 0 20px 0; letter-spacing: 0.05em; color: #3d3d3d;">Invitation</h1>
    
    <div style="width: 120px; height: 2px; background-color: #d4c5b9; margin-bottom: 60px;"></div>

    <div style="font-family: '701_700'; font-size: 56px; margin-bottom: 40px; display: flex; align-items: center; gap: 20px;">
        <span>이준호</span>
        <span style="font-weight: 400; color: #b0a59d;">&</span>
        <span>김서연</span>
    </div>

    <p style="font-size: 32px; line-height: 1.8; text-align: center; margin-bottom: 80px; color: #666;">
        소중한 분들을 모시고<br>
        저희 두 사람의 새로운 시작을 알리려 합니다.<br>
        귀한 걸음 하시어 축복해 주시면 감사하겠습니다.
    </p>

    <div style="background-color: #f5f2ef; padding: 40px 80px; border-radius: 8px; text-align: center;">
        <div style="font-family: '701_700'; font-size: 36px; margin-bottom: 20px; color: #3d3d3d;">2026. 06. 14. SAT</div>
        <div style="font-size: 32px; color: #555;">오후 1시</div>
        <div style="font-size: 32px; color: #555; margin-top: 10px;">서울 그랜드하얏트</div>
    </div>

    <div style="position: absolute; bottom: 100px; font-size: 24px; color: #c4b5a9; letter-spacing: 0.2em;">
        SAVE THE DATE
    </div>
</div>
</body>
</html>
