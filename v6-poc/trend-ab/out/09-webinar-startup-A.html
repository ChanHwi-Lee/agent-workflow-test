<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1080px; height:1080px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1080px; height: 1080px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); position: relative; overflow: hidden; font-family: '701_400'; color: #ffffff; padding: 80px; box-sizing: border-box;">
  <div style="position: absolute; top: 80px; left: 80px; width: 120px; height: 4px; background: #38bdf8;"></div>
  
  <div style="margin-top: 40px;">
    <p style="font-family: '701_700'; font-size: 32px; color: #38bdf8; letter-spacing: 4px; margin: 0 0 20px 0;">WEBINAR INVITATION</p>
    <h1 style="font-family: '1301_400'; font-size: 88px; line-height: 1.1; margin: 0; font-weight: 400;">시리즈 A 이후<br><span style="color: #38bdf8;">조직 성장 전략</span></h1>
  </div>

  <div style="margin-top: 100px; padding: 40px; background: rgba(255, 255, 255, 0.05); border-left: 4px solid #38bdf8; border-radius: 4px;">
    <p style="font-size: 28px; margin: 0 0 10px 0; opacity: 0.8;">연사</p>
    <p style="font-family: '701_700'; font-size: 48px; margin: 0;">김태훈 대표 <span style="font-size: 32px; font-weight: 400; opacity: 0.7;">(페이플러스)</span></p>
  </div>

  <div style="margin-top: 80px; display: flex; gap: 60px;">
    <div>
      <p style="font-size: 24px; opacity: 0.6; margin: 0 0 10px 0;">일시</p>
      <p style="font-family: '701_700'; font-size: 36px; margin: 0;">5월 10일 (목) 저녁 8시</p>
    </div>
    <div>
      <p style="font-size: 24px; opacity: 0.6; margin: 0 0 10px 0;">장소</p>
      <p style="font-family: '701_700'; font-size: 36px; margin: 0;">Zoom 온라인 생중계</p>
    </div>
  </div>

  <div style="position: absolute; bottom: 80px; left: 80px; right: 80px; height: 100px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 40px;">
    <p style="font-size: 24px; opacity: 0.5;">지금 사전 등록하고 웨비나 링크를 받아보세요.</p>
    <div style="background: #38bdf8; padding: 20px 40px; border-radius: 50px; font-family: '701_700'; font-size: 24px; color: #0f172a;">참가 신청하기</div>
  </div>

  <svg viewBox="0 0 400 400" style="position: absolute; top: -50px; right: -50px; width: 500px; height: 500px; opacity: 0.1;">
    <circle cx="200" cy="200" r="150" fill="none" stroke="#38bdf8" stroke-width="40"/>
    <circle cx="200" cy="200" r="80" fill="#38bdf8"/>
  </svg>
</div>
</body>
</html>
