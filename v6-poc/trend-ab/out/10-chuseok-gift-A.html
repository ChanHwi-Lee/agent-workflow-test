<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
@font-face {
  font-family: "701_400";
  src: url("https://dev-file.tooldi.com/font/701_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "701_700";
  src: url("https://dev-file.tooldi.com/font/701_700.woff") format("woff");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: "1301_400";
  src: url("https://dev-file.tooldi.com/font/1301_400.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
</style>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  body { width:1080px; height:1350px; overflow:hidden; }
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; background: linear-gradient(180deg, #2c1e15 0%, #1a120d 100%); position: relative; overflow: hidden; font-family: '701_400'; display: flex; flex-direction: column; align-items: center; color: #e6d5b8;">
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; background-image: radial-gradient(circle at 50% 50%, #d4af37 1px, transparent 1px); background-size: 40px 40px;"></div>
  
  <div style="margin-top: 100px; text-align: center;">
    <p style="font-family: '1301_400'; font-size: 48px; letter-spacing: 0.2em; color: #d4af37; margin: 0;">추석 명절 선물</p>
    <h1 style="font-family: '701_700'; font-size: 96px; margin: 20px 0; color: #f4e4c1; letter-spacing: -0.02em;">프리미엄 한과 세트</h1>
    <div style="width: 100px; height: 2px; background: #d4af37; margin: 0 auto;"></div>
  </div>

  <div style="margin: 80px 0; position: relative;">
    <img src="placeholder://traditional-korean-sweets-set" style="width: 700px; height: 700px; border-radius: 50%; border: 8px solid #d4af37; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
    <div style="position: absolute; bottom: 0; right: -50px; background: #d4af37; color: #2c1e15; padding: 20px 40px; border-radius: 50px; font-family: '701_700'; font-size: 32px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
      9종 구성
    </div>
  </div>

  <div style="text-align: center; background: rgba(255,255,255,0.05); padding: 40px 80px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3);">
    <p style="font-size: 36px; margin: 0; color: #fff;">정성을 담은 선물</p>
    <p style="font-family: '701_700'; font-size: 72px; margin: 10px 0; color: #d4af37;">55,000원</p>
    <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
      <span style="padding: 10px 20px; border: 1px solid #d4af37; border-radius: 8px; font-size: 24px;">빠른배송</span>
      <span style="padding: 10px 20px; border: 1px solid #d4af37; border-radius: 8px; font-size: 24px;">무료배송</span>
    </div>
  </div>

  <svg viewBox="0 0 100 100" style="position: absolute; bottom: 50px; width: 80px; height: 80px; opacity: 0.5;">
    <path d="M50 0 L60 30 L90 30 L65 50 L75 80 L50 60 L25 80 L35 50 L10 30 L40 30 Z" fill="#d4af37"/>
  </svg>
</div>
</body>
</html>
